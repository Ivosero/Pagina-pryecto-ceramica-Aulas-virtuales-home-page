<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom input styles for minimalistic look */
        .input-minimal {
            border: none;
            border-bottom: 1px solid #d9c1b9; /* outline-variant */
            background-color: transparent;
            padding: 12px 0;
            transition: border-color 0.3s ease;
        }
        .input-minimal:focus {
            outline: none;
            border-bottom-color: #8f482c; /* primary */
            box-shadow: none;
        }
        .input-minimal::placeholder {
            color: #87736c; /* outline */
            opacity: 0.7;

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background antialiased">
<!-- TopNavBar (Nav suppressed for linear/transactional intent, but keeping brand anchor) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm shadow-primary/5 flex justify-between items-center max-w-container-max mx-auto px-margin-desktop h-20">
<a class="font-headline-md text-headline-md text-primary tracking-tight" href="/">Ceramic Studio</a>
<!-- Nav links suppressed for login page context -->
</header>
<main class="flex-grow flex items-center justify-center pt-20 pb-stack-lg px-margin-mobile md:px-margin-desktop w-full max-w-container-max mx-auto">
<div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-stack-lg bg-surface-container-lowest rounded-xl shadow-lg shadow-primary/5 overflow-hidden min-h-[600px]">

<!-- Image content handled by background -->
</div>
<!-- Form Side -->
<div class="flex flex-col justify-center p-stack-md md:p-stack-lg">
<div class="max-w-sm w-full mx-auto">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">Enter your details to access your studio dashboard.</p>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface uppercase mb-1" for="email">Email Address</label>
<input class="input-minimal w-full font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="student@example.com" required="" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-1">
<label class="block font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
<a class="font-body-md text-body-md text-primary hover:opacity-80 transition-opacity text-sm" href="#">Forgot Password?</a>
</div>
<input class="input-minimal w-full font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-lg font-label-md text-label-md uppercase tracking-wider hover:opacity-90 hover:-translate-y-0.5 transition-all duration-200 shadow-md shadow-primary/20" type="submit">
                            Login
                        </button>
</form>
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                            New to the studio? 
                            <a class="text-primary hover:underline font-semibold ml-1" href="#">Create an account</a>
</p>
</div>
</div>
</div>
