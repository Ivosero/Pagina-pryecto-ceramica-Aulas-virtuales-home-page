<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ceramic Studio - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdcc3",

                        "primary-container": "#ad6042",
                        "error": "#ba1a1a",
                        "on-primary-container": "#fffbff",
                        "primary-fixed": "#ffdbce",
                        "tertiary-container": "#986b46",
                        "on-primary": "#ffffff",

                        "primary-fixed-dim": "#ffb59a",
                        "on-background": "#1b1c1a",

                        "on-secondary-fixed": "#2c1600",
                        "on-tertiary-fixed-variant": "#643e1e",
                        "tertiary": "#7c5330",

                        "surface-container": "#efeeea",
                        "outline": "#87736c",
                        "on-surface-variant": "#54433d",
                        "on-error": "#ffffff",
                        "background": "#fbf9f5",
                        "inverse-on-surface": "#f2f0ed",
                        "surface-container-highest": "#e4e2de",
                        "secondary-container": "#ffca98",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#380d00",
                        "primary": "#8f482c"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "stack-lg": "80px",
                        "margin-desktop": "64px",
                        "container-max": "1280px",

                    "fontFamily": {

<style>
        .glass-panel {
            background: rgba(251, 249, 245, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .ambient-shadow {
            box-shadow: 0 20px 40px rgba(188, 108, 77, 0.08);
        }

        .input-minimal {
            border: none;
            border-bottom: 1px solid var(--tw-colors-outline-variant);
            border-radius: 0;
            background: transparent;
            transition: border-color 0.3s ease;
        }
        
        .input-minimal:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: #D4A373; /* Sand tint for focus */
        }
    </style>
</head>
<body class="bg-background min-h-screen text-on-surface font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Note: Top NavBar is intentionally suppressed as this is a linear transactional (Sign-up) screen per guidelines. -->
<main class="w-full min-h-screen flex items-stretch">
<!-- Left Side: Image Canvas -->
<section class="hidden lg:block lg:w-1/2 relative bg-surface-container-low overflow-hidden">
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="A beautifully composed, high-end editorial photograph of finished ceramic pieces arranged on a rustic wooden studio table. The ceramics feature organic shapes and natural glazes in earthy tones of terracotta, sand, and charcoal. Soft, diffused natural light pours in from a nearby window, creating gentle ambient shadows and highlighting the tactile, textured surfaces of the pottery. The mood is warm, inspiring, and meticulously crafted, reflecting a minimalist and sophisticated artist's studio aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMT-WAZJNeb4MozrWukizcT1BeRGyS2Mw12xWsYoF1nZxpV5WnmJXKcChcg0u6x_0qfde6bgaNwq3fR-2DvE2xGq4Xdgp44jZYSVcjifiB_KySnivshdP_YAxNeNrHo4FM9q0fxJKqKfl7N2u_9oWAA5sDH5XX2G_p3jWvzT6bnSq5KONzuIJk9Yn1AWXg6iw-iqKktiEScJvDsnmOLccqEjHvQyK9QBpCbqhBo0pKLi94-0d7IPk8fg"/>
</div>
<!-- Subtle gradient overlay to ensure the image feels grounded -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-dim/40 to-transparent z-10"></div>
<div class="absolute bottom-margin-desktop left-margin-desktop z-20 max-w-md">
<blockquote class="font-headline-lg text-headline-lg text-surface drop-shadow-md mb-stack-sm">
                    "Shape your intent. Fire your craft."
                </blockquote>
<p class="font-body-lg text-body-lg text-surface-bright/90">Join our community of tactile creators.</p>
</div>
</section>
<!-- Right Side: Registration Form -->
<section class="w-full lg:w-1/2 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-stack-lg bg-surface relative z-10">
<div class="w-full max-w-[480px] glass-panel ambient-shadow rounded-[24px] p-stack-md md:p-stack-lg">
<header class="mb-stack-lg text-center">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-unit tracking-tight">
                        Ceramic Studio
                    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Begin your journey with the clay.
                    </p>
</header>
<form class="flex flex-col gap-stack-sm w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md uppercase text-on-surface-variant" for="fullName">Full Name</label>
<input class="input-minimal w-full font-body-md text-body-md text-on-surface py-2" id="fullName" placeholder="e.g. Jane Doe" required="" type="text"/>
</div>
<div class="flex flex-col gap-unit mt-unit">
<label class="font-label-md text-label-md uppercase text-on-surface-variant" for="email">Email Address</label>
<input class="input-minimal w-full font-body-md text-body-md text-on-surface py-2" id="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-unit mt-unit">
<label class="font-label-md text-label-md uppercase text-on-surface-variant" for="password">Password</label>
<input class="input-minimal w-full font-body-md text-body-md text-on-surface py-2" id="password" placeholder="Minimum 8 characters" required="" type="password"/>
</div>
<button class="mt-stack-sm w-full bg-[#BC6C4D] text-white font-label-md text-label-md py-4 rounded-xl hover:bg-primary-container hover:-translate-y-1 hover:shadow-lg shadow-primary/20 transition-all duration-300 ease-in-out flex justify-center items-center gap-2 group" type="submit">
                        Join the Studio
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:text-primary-container transition-colors underline underline-offset-4 decoration-primary/30 hover:decoration-primary" href="#">Log in</a>
</p>
</div>
</div>
<div class="absolute bottom-margin-mobile text-center w-full max-w-[480px]">
<p class="font-body-md text-[12px] text-on-surface-variant/70">
                    By joining, you agree to our <a class="underline hover:text-primary transition-colors" href="#">Terms of Service</a> &amp; <a class="underline hover:text-primary transition-colors" href="#">Privacy Policy</a>.
                </p>
</div>
</section>
</main>
</body></html>
